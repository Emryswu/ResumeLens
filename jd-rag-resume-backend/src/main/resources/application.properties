spring.application.name=jd-rag-resume-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/jd_rag_resume?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:jd_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Existing Hibernate-created databases are recorded as version 1 without changing their data.
# Empty databases execute V1__initial_schema.sql normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing Hibernate schema

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.jackson.time-zone=Asia/Shanghai
spring.jackson.default-property-inclusion=non_null

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
app.jwt.refresh-expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:7}
app.jwt.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

app.upload.resume-dir=uploads/resumes
app.upload.max-resumes-per-user=${UPLOAD_MAX_RESUMES_PER_USER:30}
app.upload.max-stored-bytes-per-user=${UPLOAD_MAX_STORED_BYTES_PER_USER:209715200}

ai.api-key=${AI_API_KEY:}
ai.base-url=${AI_BASE_URL:}
ai.model=${AI_MODEL:}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}
ai.mock-enabled=${AI_MOCK_ENABLED:false}

# Assistant (tool-calling agent). The emitter timeout must outlive the turn budget:
# Tomcat's default async timeout is 30s.
app.agent.max-steps=${AGENT_MAX_STEPS:6}
app.agent.turn-timeout-seconds=${AGENT_TURN_TIMEOUT_SECONDS:90}
app.agent.model-call-timeout-seconds=${AI_TIMEOUT_SECONDS:60}
app.agent.emitter-timeout-ms=${AGENT_EMITTER_TIMEOUT_MS:120000}
app.agent.max-turns-per-window=${AGENT_MAX_TURNS_PER_WINDOW:20}
app.agent.window-minutes=${AGENT_WINDOW_MINUTES:10}

app.analysis.pending-timeout-minutes=${ANALYSIS_PENDING_TIMEOUT_MINUTES:10}
app.analysis.recovery-interval-ms=${ANALYSIS_RECOVERY_INTERVAL_MS:60000}
app.analysis.max-pending-per-user=${ANALYSIS_MAX_PENDING_PER_USER:2}
app.analysis.max-submits-per-window=${ANALYSIS_MAX_SUBMITS_PER_WINDOW:10}
app.analysis.submit-window-minutes=${ANALYSIS_SUBMIT_WINDOW_MINUTES:10}

# CSRF: browsers without Sec-Fetch-Site must send an Origin from this list (full origin, comma-separated).
# Shared with the BFF via TRUSTED_ORIGINS; set it to the public https origin behind a reverse proxy.
app.security.trusted-origins=${TRUSTED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.auth.login-max-per-window=${AUTH_LOGIN_MAX_PER_WINDOW:20}
app.auth.login-window-minutes=${AUTH_LOGIN_WINDOW_MINUTES:15}
app.auth.register-max-per-window=${AUTH_REGISTER_MAX_PER_WINDOW:8}
app.auth.register-window-minutes=${AUTH_REGISTER_WINDOW_MINUTES:30}

app.rag.chunk-size=${RAG_CHUNK_SIZE:900}
app.rag.chunk-overlap=${RAG_CHUNK_OVERLAP:120}
app.rag.top-k=${RAG_TOP_K:5}
app.rag.max-chunks=${RAG_MAX_CHUNKS:80}
app.rag.embedding-batch-size=${RAG_EMBEDDING_BATCH_SIZE:8}
app.rag.min-similarity=${RAG_MIN_SIMILARITY:0.72}
app.rag.hybrid-enabled=${RAG_HYBRID_ENABLED:true}
app.rag.keyword-boost=${RAG_KEYWORD_BOOST:0.035}
app.rag.max-keyword-boosts=${RAG_MAX_KEYWORD_BOOSTS:3}
app.rag.dual-query-enabled=${RAG_DUAL_QUERY_ENABLED:true}
app.rag.max-length=${RAG_MAX_LENGTH:8192}
app.rag.embedding-dimensions=${RAG_EMBEDDING_DIMENSIONS:768}
# token_embeddings == last_hidden_state in the onnx-community export; pooling is CLS (first token).
app.rag.model-output-name=${RAG_MODEL_OUTPUT_NAME:token_embeddings}
app.rag.pooling-mode=${RAG_POOLING_MODE:cls}
app.rag.embedding-model-id=${RAG_EMBEDDING_MODEL_ID:Alibaba-NLP/gte-multilingual-base-int8}
app.rag.embedding-tokenizer-uri=${RAG_EMBEDDING_TOKENIZER_URI:https://huggingface.co/onnx-community/gte-multilingual-base/resolve/2edbf5e672aab465f9ed4c154a8b61791c082c69/tokenizer.json}
app.rag.embedding-model-uri=${RAG_EMBEDDING_MODEL_URI:https://huggingface.co/onnx-community/gte-multilingual-base/resolve/2edbf5e672aab465f9ed4c154a8b61791c082c69/onnx/model_int8.onnx}
app.rag.embedding-tokenizer-sha256=${RAG_EMBEDDING_TOKENIZER_SHA256:3a56def25aa40facc030ea8b0b87f3688e4b3c39eb8b45d5702b3a1300fe2a20}
app.rag.embedding-model-sha256=${RAG_EMBEDDING_MODEL_SHA256:ab2bd164ebd8ca9003dc49a981b611e849b5d326f504c8873ba76e07fa6c0082}
app.rag.query-prefix=${RAG_QUERY_PREFIX:Represent this sentence for searching relevant passages:}
app.rag.lucene-index-dir=${RAG_LUCENE_INDEX_DIR:data/lucene/resume-vectors}
