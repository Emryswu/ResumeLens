name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    # Also validate dependent PRs whose base is another feature branch.

# GITHUB_TOKEN 只给读权限：这里只 checkout、构建、测试、上传报告，不写仓库。
# 仓库默认值目前也是 read，但写在 workflow 里才不会随仓库设置被悄悄放大。
permissions:
  contents: read

# 同一分支上新的推送会取消仍在排队的旧运行，避免浪费 runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector-service:
    name: 独立浏览器采集 · Patchright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: collector-service/package-lock.json
      - run: npm ci
        working-directory: collector-service
      - run: npm test
        working-directory: collector-service
      - run: npx patchright install --with-deps chromium
        working-directory: collector-service
      - run: npm run test:browser
        working-directory: collector-service

  # commit 只署作者本人。只查本 PR 新增的提交（base..head），不回头查 main 的历史；
  # 检查逻辑在脚本里，本地可单独运行：node .github/scripts/check-commit-messages.mjs origin/main HEAD
  commit-messages:
    name: 提交信息署名检查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # 要拿到 base 和 head 之间的全部提交，不能只取最近一次
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 检查脚本自测
        run: node --test .github/scripts/check-commit-messages.test.mjs

      - name: 检查本 PR 新增提交的提交信息
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-commit-messages.mjs "$BASE_SHA" "$HEAD_SHA"

  conversation-browser:
    name: 会话恢复 · 真实浏览器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jd-rag-resume-frontend/package-lock.json
      - run: npm ci
        working-directory: jd-rag-resume-frontend
      - run: npx playwright install --with-deps chromium
        working-directory: jd-rag-resume-frontend
      - run: npm run test:e2e
        working-directory: jd-rag-resume-frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversation-browser-results
          path: jd-rag-resume-frontend/output/playwright/
          retention-days: 7

  backend:
    name: 后端 · Java 21
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # GitHub 托管的 ubuntu runner 自带 Docker，因此 Testcontainers 用例
      # （外键级联、Flyway 索引和 repository JPQL，真起 mysql:9.7.0）
      # 会在这里真实执行。开发者本机 Windows 的 PATH 里没有 docker 命令，
      # 这些用例只会被静默跳过 —— CI 是它们唯一稳定跑到的地方。
      - name: 构建与测试
        working-directory: jd-rag-resume-backend
        run: ./mvnw -B --no-transfer-progress verify

      # 失败时同样上传，否则排查 CI 红灯只能靠日志里被截断的堆栈
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: jd-rag-resume-backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: 前端 · Node 22
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # package.json 的 engines 要求 >=22.13.0；测试脚本用到
      # node --experimental-strip-types 直接执行 .ts 测试文件
      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: jd-rag-resume-frontend/package-lock.json

      - name: 安装依赖
        working-directory: jd-rag-resume-frontend
        run: npm ci

      - name: 代码规范检查
        working-directory: jd-rag-resume-frontend
        run: npm run lint

      # npm test 内部串联了 vinext build，构建失败会一并暴露
      - name: 测试（含生产构建）
        working-directory: jd-rag-resume-frontend
        run: npm test

  extension:
    name: Chrome 扩展 · Node 22
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 测试
        working-directory: browser-extension
        run: npm test

      - name: 打包
        working-directory: browser-extension
        run: npm run pack

      - name: 校验安装包
        run: unzip -t browser-extension/dist/resumelens-browser-extension-v*.zip

      - name: 上传扩展安装包
        uses: actions/upload-artifact@v4
        with:
          name: resumelens-browser-extension
          path: browser-extension/dist/resumelens-browser-extension-v*.zip
          retention-days: 7
