services:
  mysql:
    image: mysql:9.7.0
    environment:
      MYSQL_DATABASE: jd_rag_resume
      MYSQL_USER: jd_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in compose.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in compose.env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-9-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot --password="$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./jd-rag-resume-backend
    environment:
      TZ: Asia/Shanghai
      DB_URL: jdbc:mysql://mysql:3306/jd_rag_resume?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: jd_app
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in compose.env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in compose.env}
      # false keeps http://127.0.0.1:3000 login working. Set true for HTTPS.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      # CSRF Origin fallback. Same default as application.properties: an empty value
      # would override Spring's default with an empty list and block local logins.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AI_MOCK_ENABLED: ${AI_MOCK_ENABLED:-true}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
      - model-cache:/root/.cache
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./jd-rag-resume-frontend
    environment:
      BACKEND_API_URL: http://backend:8080
      HOST: 0.0.0.0
      PORT: 3000
      # Must match the backend's list (see backend.environment.TRUSTED_ORIGINS).
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-9-data:
  backend-data:
  backend-uploads:
  model-cache:
