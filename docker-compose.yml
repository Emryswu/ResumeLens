services:
  mysql:
    image: mysql:9.7.0
    environment:
      MYSQL_DATABASE: jd_rag_resume
      MYSQL_USER: jd_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in compose.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in compose.env}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-9-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot --password="$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./jd-rag-resume-backend
    environment:
      TZ: Asia/Shanghai
      # Only the frontend container may stamp X-BFF-Client-IP. Keep this in step with
      # frontend.networks.default.ipv4_address; ComposeTrustedProxyTests checks the defaults.
      TRUSTED_PROXIES: ${BACKEND_TRUSTED_PROXIES:-172.29.88.10}
      DB_URL: jdbc:mysql://mysql:3306/jd_rag_resume?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: jd_app
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in compose.env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in compose.env}
      # false keeps http://127.0.0.1:3000 login working. Set true for HTTPS.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      # CSRF Origin fallback. Same default as application.properties: an empty value
      # would override Spring's default with an empty list and block local logins.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      AI_MOCK_ENABLED: ${AI_MOCK_ENABLED:-true}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      # Optional: the bearer token a Prometheus scraper presents to /actuator/prometheus
      # (at least 32 characters). Leave empty to expose no metrics at all.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
      - model-cache:/root/.cache
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build:
      context: ./jd-rag-resume-frontend
    environment:
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      BACKEND_API_URL: http://backend:8080
      HOST: 0.0.0.0
      PORT: 3000
      # Must match the backend's list (see backend.environment.TRUSTED_ORIGINS).
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      default:
        # Pinned so the backend can trust exactly this peer; a Docker-assigned address
        # cannot be listed in advance and every user would share the BFF's rate-limit bucket.
        ipv4_address: ${FRONTEND_IP:-172.29.88.10}
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        # Change all three together if this range collides with a local network:
        # RESUMELENS_SUBNET, FRONTEND_IP and BACKEND_TRUSTED_PROXIES.
        - subnet: ${RESUMELENS_SUBNET:-172.29.88.0/24}

volumes:
  mysql-9-data:
  backend-data:
  backend-uploads:
  model-cache:
